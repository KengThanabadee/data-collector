[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "option-collector"
version = "0.1.0"
description = "Public market data archives with legacy Deribit collector compatibility"
requires-python = ">=3.12,<3.13"
dependencies = ["aiohttp==3.14.5"]

[project.scripts]
option-collector = "option_collector.cli:main"

[tool.setuptools.packages.find]
include = ["option_collector*", "data_collector*"]
