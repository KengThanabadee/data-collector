# Bybit linear liquidation and BTC/ETH option trade event streams.
# stream.bytick.com is Bybit's alternative public WebSocket host.
[data_collector]
schema = "dc.config/2"
venue = "bybit"
environment = "production"
data_root = "../data/v2/bybit-events"
capture_mode = "raw"
event_streams = true
bybit_liquidation_symbols = ["BTCUSDT", "ETHUSDT"]
raw_processes = 1
raw_segment_bytes = 8388608
bybit_rest_host = "api.bytick.com"
bybit_ws_host = "stream.bytick.com"
bootstrap_timeout_seconds = 180
timeout_seconds = 30
warmup_timeout_seconds = 180
chronyc = "chronyc"
duration_seconds = 0
max_frames = 0
max_bytes = 0
