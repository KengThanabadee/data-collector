# Inverse-only top-20, ticker, per-kind trades and BTC/ETH indexes with live discovery.
# Choose environment/data_root explicitly for production; use a writable Linux root.
[data_collector]
schema = "dc.config/2"
venue = "deribit"
environment = "testnet"
data_root = "../data/v2/testnet-live-options"
capture_mode = "raw"
all_options = true
raw_processes = 1
rediscover_options = true
raw_segment_bytes = 8388608
symbols = []
subscription_batch_size = 500
bootstrap_timeout_seconds = 180
timeout_seconds = 60
warmup_timeout_seconds = 180
chronyc = "chronyc"
duration_seconds = 0
max_frames = 0
max_bytes = 0
